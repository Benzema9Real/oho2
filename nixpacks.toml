[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "python -m venv /app/venv",
    "cd ohO && /app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "cd ohO && /app/venv/bin/python manage.py makemigrations",
    "cd ohO && /app/venv/bin/python manage.py migrate",
    "cd ohO && /app/venv/bin/python manage.py collectstatic --noinput",
    "cd ohO && /app/venv/bin/python create_superuser.py"
]

[start]
cmd = "cd ohO && /app/venv/bin/gunicorn oho_kg.wsgi --bind 0.0.0.0:$PORT"