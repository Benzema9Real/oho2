{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Регистрация - NOVIAS</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* Можно добавить кастомные стили для адаптивности */
    .register-card {
      max-width: 400px;
      background-color: #bcdeb4;
    }
    @media (max-width: 450px) {
      .register-card {
        margin: 0 15px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body style="background-color: #ffffff;">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4 shadow-sm register-card w-100">
      <h3 class="text-center mb-4" style="color: #2f4f4f;">Регистрация в NOVIAS</h3>

      {% if form.errors %}
        <div class="alert alert-danger">
          Пожалуйста, исправьте ошибки в форме
        </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_name" class="form-label">Имя</label>
          <input type="text" name="name" class="form-control" id="id_name" required />
        </div>

        <div class="mb-3">
          <label for="id_email" class="form-label">Email</label>
          <input type="email" name="email" class="form-control" id="id_email" required />
        </div>

        <div class="mb-3">
          <label for="id_password1" class="form-label">Пароль</label>
          <input type="password" name="password1" class="form-control" id="id_password1" required />
        </div>

        <div class="mb-3">
          <label for="id_password2" class="form-label">Подтверждение пароля</label>
          <input type="password" name="password2" class="form-control" id="id_password2" required />
        </div>

        <button type="submit" class="btn w-100" style="background-color: #ffffff; color: #2f4f4f;">Зарегистрироваться</button>
      </form>

      <div class="mt-3 text-center">
        <a href="{% url 'login' %}" style="color: #2f4f4f;">Уже есть аккаунт? Войти</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
