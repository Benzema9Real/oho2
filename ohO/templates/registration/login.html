{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - NOVIAS</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #ffffff;">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 350px; background-color: #bcdeb4;">
        <h3 class="text-center mb-4" style="color: #2f4f4f;">Вход в NOVIAS</h3>
        {% if form.errors %}
            <div class="alert alert-danger">Неверный email или пароль</div>
        {% endif %}
        <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_email" class="form-label">Email</label>
        <input type="email" name="email" class="form-control" id="id_email" required>
    </div>

    <div class="mb-3">
        <label for="id_password" class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" id="id_password" required>
    </div>

    <button type="submit" class="btn w-100" style="background-color: #ffffff; color: #2f4f4f;">Войти</button>
</form>

        <div class="mt-3 text-center">
            <a href="{% url 'register' %}" style="color: #2f4f4f;">Регистрация</a>
        </div>
    </div>
</div>
</body>
</html>
